# AlphaQuant configuration -- single source of truth for the asset universe.
# Paths are NOT configured here: they are resolved from the repo root by
# alphaquant.core.paths.

tickers:
  # US equity indices (ETFs)
  - SPY
  - QQQ
  - DIA
  - IWM
  # Mega-cap equities
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  # Cross-asset ETFs: gold, long Treasuries, high-yield credit, US dollar, oil
  - GLD
  - TLT
  - HYG
  - UUP
  - USO
  # Crypto (trades 7 days a week -- calendar alignment required)
  - BTC-USD
  - ETH-USD

# Data sources (see docs/architecture.md). Crypto = tickers ending in -USD.
data:
  equity_provider: tiingo     # needs TIINGO_API_KEY in .env (repo root)
  crypto_provider: coinbase   # public endpoint, no key

start_date: "2015-01-01"
end_date: null
interval: "1d"

features:
  returns: "log"
  sma_windows: [10, 20, 50]
  ema_windows: [12, 26]
  rsi_windows: [14]
  macd: { fast: 12, slow: 26, signal: 9 }
  bollinger: { window: 20, k: 2.0 }
  atr_window: 14
  lags: [1, 2, 3, 5]

seed: 42

risk:
  garch_p: 1
  garch_q: 1
  garch_horizon: 10
  n_regimes: 2
  roll_window: 21
  regime_method: "kmeans"
